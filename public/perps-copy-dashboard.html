<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1ece2">
<title>Pair Grid Paper</title>
<style>
:root{--bg:#f1ece2;--paper:#faf6ee;--ink:#1d2430;--muted:#6b6a66;--line:#d9d1c2;--long:#1f7a5c;--short:#b4442f;--warn:#a8741a;--accent:#2b3f7a;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Iowan Old Style","Palatino Linotype",Georgia,serif;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
main{max-width:1100px;margin:0 auto}
h1,h2,h3,p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font-size:22px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.pill{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.6px;padding:7px 9px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap;color:var(--warn)}
.pill.ok{color:var(--long)}.pill.bad{color:var(--short)}
.banner{margin-top:10px;padding:9px 11px;border-left:4px solid var(--short);background:#f6e3dc;font-size:13px;display:none}
.banner.show{display:block}.banner.warn{border-color:var(--warn);background:#f5ead3}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:12px}
.label{font:700 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.eq{font:700 clamp(40px,12vw,64px)/1 var(--mono);letter-spacing:-2px;margin-top:6px;font-variant-numeric:tabular-nums}
.eqmeta{font-size:13px;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.kv b{display:block;font:600 16px/1.25 var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--long)}.neg{color:var(--short)}.unk{color:var(--warn)}
svg{display:block;width:100%;height:150px;margin-top:12px}
.legs{display:grid;gap:12px}
.leg{border-top:6px solid var(--long)}.leg.SHORT{border-top-color:var(--short)}
.leghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font:700 26px/1 var(--mono)}
.dir{font:700 12px var(--mono);letter-spacing:1px}
.mark{font:700 clamp(36px,11vw,52px)/1.05 var(--mono);letter-spacing:-1.5px;margin-top:10px;font-variant-numeric:tabular-nums}
.anchor{font-size:13px;color:var(--muted);margin-top:4px}
.decision{margin-top:12px;padding:10px;background:#efe8da;border-radius:4px;font-size:14px}
.thr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.thr div{border:1px dashed var(--line);padding:8px;border-radius:4px;font-size:12.5px}
.thr b{font:700 17px var(--mono);display:block}
.ladder{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.lv{font:600 11px var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.lv.DONE.ADD{background:var(--short);color:#fbf4ea;border-color:var(--short)}
.lv.DONE.REDUCE{background:var(--long);color:#fbf4ea;border-color:var(--long)}
.pend{margin-top:10px;padding:9px;border-left:3px solid var(--warn);background:#f5ead3;font-size:13px}
.closed{margin-top:10px;font:700 13px var(--mono);color:var(--short)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:11.5px}
.r{text-align:right}
details summary{cursor:pointer;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.6px;padding:6px 0}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:4px;font-size:13px}
.note{font-size:13px;margin-top:8px}
h2{font-size:17px;margin-bottom:8px}
footer{color:var(--muted);font:11px var(--mono);text-align:center;margin-top:16px}
@media(min-width:780px){.legs{grid-template-columns:1fr 1fr}.top{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.top .card{margin-top:12px}.grid2.wide{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
<header>
  <div><h1 id="name">Pair Grid Paper</h1><p class="sub" id="sub">BTC long / ETH short · paper only · read-only</p></div>
  <span id="pill" class="pill">connecting</span>
</header>
<div id="banner" class="banner" role="status"></div>

<div class="top">
<section class="card">
  <div class="label">Marked equity</div>
  <div id="equity" class="eq">--</div>
  <p id="eqmeta" class="eqmeta"></p>
  <svg id="chart" viewBox="0 0 600 150" preserveAspectRatio="none" aria-label="Equity curve"></svg>
  <p id="chartmeta" class="label" style="margin-top:4px"></p>
</section>
<section class="card">
  <div class="label">Account</div>
  <div class="grid2" id="acct"></div>
</section>
</div>

<section class="legs" id="legs"></section>

<section class="card">
  <h2>Trades</h2>
  <div id="trades"></div>
  <details id="tradesMoreWrap"><summary>Full trade history</summary><div id="tradesMore"></div></details>
</section>

<section class="card">
  <h2>Execution honesty</h2>
  <div id="exec"></div>
</section>

<section class="card">
  <details><summary>Events log</summary><div id="events"></div></details>
</section>

<section class="card">
  <h2>Strategy</h2>
  <div id="strategy"></div>
</section>
<footer id="foot">Waiting for first snapshot</footer>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var isNum=function(v){return v!==null&&v!==undefined&&v!==''&&isFinite(Number(v))};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function money(v,d){if(!isNum(v))return'unknown';return'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function smoney(v){if(!isNum(v))return'unknown';var n=Number(v);return(n>0?'+':n<0?'-':'')+money(Math.abs(n))}
function price(v){if(!isNum(v))return'--';var n=Number(v);return'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:n<10?4:2})}
function pct(v){if(!isNum(v))return'--';var n=Number(v);return(n>0?'+':'')+n.toFixed(3)+'%'}
function qty(v){if(!isNum(v))return'--';return Math.abs(Number(v)).toLocaleString('en-US',{maximumFractionDigits:6})}
function cls(v){return!isNum(v)?'unk':Number(v)>0?'pos':Number(v)<0?'neg':''}
function tm(v){if(!v)return'--';var d=new Date(isNum(v)?Number(v):v);return isNaN(d)?'--':d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function ago(v){if(!v)return'';var d=new Date(isNum(v)?Number(v):v).getTime();if(isNaN(d))return'';var s=Math.round((Date.now()-d)/1000);return s<60?s+'s ago':Math.round(s/60)+'m ago'}
var cache={};
function set(id,html){var el=$(id);if(el&&cache[id]!==html){cache[id]=html;el.innerHTML=html}}
function txt(id,t,c){var el=$(id);if(!el)return;if(el.textContent!==t)el.textContent=t;if(c!=null&&el.className!==c)el.className=c}

function chart(curve){
  var pts=(Array.isArray(curve)?curve:[]).map(function(p){return{t:new Date(p&&p.at).getTime(),e:p&&isNum(p.equity)?Number(p.equity):null}}).filter(function(p){return!isNaN(p.t)});
  var key=pts.length+':'+(pts.length?pts[0].t+':'+pts[pts.length-1].t+':'+pts[pts.length-1].e:'');
  if(cache.chartKey===key)return;cache.chartKey=key;
  var known=pts.filter(function(p){return p.e!==null});
  if(known.length<2){set('chart','<text x="300" y="80" text-anchor="middle" font-family="monospace" font-size="13" fill="#6b6a66">'+(pts.length?'Not enough priced points yet':'No equity history yet')+'</text>');txt('chartmeta',pts.length-known.length?(pts.length-known.length)+' unpriced points shown as gaps':'');return}
  var t0=pts[0].t,t1=pts[pts.length-1].t||t0+1,mn=Infinity,mx=-Infinity;known.forEach(function(p){mn=Math.min(mn,p.e);mx=Math.max(mx,p.e)});
  if(mx-mn<1e-9){mx+=1;mn-=1}var pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  var X=function(t){return t1===t0?300:(t-t0)/(t1-t0)*600},Y=function(e){return 145-(e-mn)/(mx-mn)*140};
  var d='',pen=false,gaps=0;pts.forEach(function(p){if(p.e===null){pen=false;gaps++;return}d+=(pen?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.e).toFixed(1);pen=true});
  var start=known[0].e,last=known[known.length-1].e,col=last>=start?'#1f7a5c':'#b4442f';
  set('chart','<line x1="0" x2="600" y1="'+Y(start).toFixed(1)+'" y2="'+Y(start).toFixed(1)+'" stroke="#d9d1c2" stroke-dasharray="4 4"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" vector-effect="non-scaling-stroke"/>');
  txt('chartmeta','range '+money(mn+pad,0)+' to '+money(mx-pad,0)+(gaps?' · '+gaps+' unknown points as gaps':''));
}

function leg(l){
  l=l||{};var dir=l.direction==='SHORT'?'SHORT':'LONG';
  var nf=l.nextFavourable,na=l.nextAdverse,p=l.pending;
  var lv=(Array.isArray(l.levels)?l.levels:[]).slice().sort(function(a,b){return Number(a&&a.level)-Number(b&&b.level)});
  var done=lv.filter(function(x){return x&&x.status==='DONE'}).length;
  var thr=function(x,lab,act){return'<div><span class="label">'+lab+'</span>'+(x?'<b>'+price(x.price)+'</b>level '+esc(x.level)+' · at '+pct(x.movePercent)+'<br>'+act:'<b>--</b>none remaining')+'</div>'};
  return'<article class="card leg '+dir+'">'+
   '<div class="leghead"><span class="sym">'+esc(l.symbol||'--')+'</span><span class="dir '+(dir==='LONG'?'pos':'neg')+'">'+dir+(l.instrumentId?' · '+esc(l.instrumentId):'')+'</span></div>'+
   '<div class="mark">'+price(l.mark)+'</div>'+
   '<p class="anchor">mark '+(l.markAt?ago(l.markAt):'time unknown')+' · original anchor <b class="num">'+price(l.originalEntry)+'</b> · move <b class="num '+cls(l.movePercent)+'">'+pct(l.movePercent)+'</b> (favourable +)</p>'+
   (l.closedPermanently?'<p class="closed">CLOSED PERMANENTLY · never reopens</p>':'')+
   (!l.initialized?'<p class="closed" style="color:var(--warn)">Not yet initialized</p>':'')+
   '<div class="decision"><span class="label">Decision</span><br>'+esc(l.decision||'No decision reported')+'</div>'+
   '<div class="grid2">'+
    '<div class="kv"><span class="label">Unrealized</span><b class="'+cls(l.unrealizedPnl)+'">'+smoney(l.unrealizedPnl)+'</b></div>'+
    '<div class="kv"><span class="label">Margin units</span><b>'+(isNum(l.capitalUnits)?Number(l.capitalUnits).toFixed(2):'--')+' / init '+(isNum(l.initialUnits)?esc(l.initialUnits):'--')+'</b></div>'+
    '<div class="kv"><span class="label">Quantity</span><b>'+qty(l.quantity)+'</b></div>'+
    '<div class="kv"><span class="label">Avg entry</span><b>'+price(l.entryPrice)+'</b></div>'+
    '<div class="kv"><span class="label">Notional</span><b>'+money(l.notional)+'</b></div>'+
    '<div class="kv"><span class="label">Margin</span><b>'+money(l.margin)+'</b></div>'+
   '</div>'+
   '<div class="thr">'+thr(nf,'Next favourable','reduce 2 units')+thr(na,'Next adverse','add 2 units if margin allows')+'</div>'+
   (p?'<div class="pend"><b>PENDING '+esc(p.kind)+'</b> level '+esc(p.level)+' · '+esc(p.units)+' units @ '+money(p.unitValue)+'/unit · remaining '+money(p.notionalRemaining)+' · filled '+money(p.filledNotional)+'<br><small>'+esc(p.reason||'')+' · since '+tm(p.createdAt)+'</small></div>':'')+
   '<p class="label" style="margin-top:12px">Levels · '+done+' done / '+lv.length+'</p>'+
   (lv.length?'<div class="ladder">'+lv.map(function(x){x=x||{};return'<span class="lv '+esc(x.status)+' '+esc(x.action)+'" title="'+esc(x.action)+' '+esc(x.status)+(x.at?' '+tm(x.at):'')+(isNum(x.filledNotional)?' filled '+money(x.filledNotional):'')+'">'+(Number(x.level)>0?'+':'')+esc(x.level)+' '+price(x.price)+'</span>'}).join('')+'</div>':'<div class="empty">No levels reported</div>')+
  '</article>';
}

function trade(t){
  t=t||{};
  return'<div class="row"><div><b class="'+(t.side==='BUY'?'pos':'neg')+'">'+esc(t.action)+' '+esc(t.side)+'</b> '+esc(t.symbol)+(t.level!=null?' · L'+esc(t.level):'')+
   '<small class="num">'+qty(t.quantity)+' @ '+price(t.price)+' = '+money(t.notional)+(isNum(t.triggerPrice)?' · trigger '+price(t.triggerPrice):'')+'</small>'+
   '<small>'+esc(t.reason||'')+' · '+esc(t.liquidity||'')+' · '+tm(t.timestamp)+'</small></div>'+
   '<div class="r num"><b class="'+cls(t.netRealizedPnl)+'">'+smoney(t.netRealizedPnl)+'</b><small>gross '+smoney(t.realizedPnl)+'</small><small>fee -'+money(t.fee)+'</small></div></div>';
}

function render(s){
  var a=s.account||{},st=s.strategy||{},ex=s.execution||{},ps=s.persistence||{};
  txt('name',st.name||'Pair Grid Paper');
  txt('sub',(st.mode?st.mode+' · ':'')+(isNum(st.leverage)?st.leverage+'x':'--')+' · step '+(isNum(st.stepPercent)?st.stepPercent+'%':'--')+' · read-only');
  var status=String(s.status||'unknown');
  txt('pill',status.replace(/_/g,' '),'pill '+(/run|ok|active/i.test(status)?'ok':/err|degrad|halt|fail/i.test(status)?'bad':''));
  var known=a.equityKnown!==false&&isNum(a.equity);
  txt('equity',known?money(a.equity):'unknown','eq '+(known?cls(Number(a.equity)-Number(a.startingCapital)):'unk'));
  txt('eqmeta',(known?'':'Unpriced: '+((a.unpricedSymbols||[]).join(', ')||'unknown')+' · ')+'start '+money(a.startingCapital)+' · '+(s.statusMessage||''));
  var kv=function(l,v,c){return'<div class="kv"><span class="label">'+l+'</span><b class="'+(c||'')+'">'+v+'</b></div>'};
  set('acct',
   kv('Unit (1% equity)',money(a.unitValue))+kv('Cash',money(a.cash))+
   kv('Floating P&amp;L',smoney(a.floatingPnl),cls(a.floatingPnl))+kv('Realized P&amp;L',smoney(a.realizedPnl),cls(a.realizedPnl))+
   kv('Fees paid',money(a.fees))+kv('Funding P&amp;L',smoney(a.fundingPnl),cls(a.fundingPnl))+
   kv('Open notional',money(a.openNotional))+kv('Initial margin',money(a.initialMargin))+
   kv('Free margin',money(a.freeMargin),isNum(a.freeMargin)&&Number(a.freeMargin)<0?'neg':'')+kv('Peak equity',money(a.peakEquity))+
   kv('Max drawdown',isNum(a.maxDrawdown)?money(a.maxDrawdown):'--')+kv('Effective lev.',known&&isNum(a.openNotional)&&Number(a.equity)>0?(a.openNotional/a.equity).toFixed(2)+'x':'--'));
  chart(s.equityCurve);
  var legs=Array.isArray(s.legs)?s.legs:[];
  set('legs',legs.length?legs.map(leg).join(''):'<div class="card empty">No legs reported yet</div>');
  var tr=(Array.isArray(s.trades)?s.trades:[]).slice().sort(function(x,y){return new Date(y&&y.timestamp)-new Date(x&&x.timestamp)});
  set('trades',tr.length?tr.slice(0,6).map(trade).join(''):'<div class="empty">No trades yet</div>');
  $('tradesMoreWrap').style.display=tr.length>6?'':'none';
  set('tradesMore',tr.slice(6).map(trade).join(''));
  var fe=ex.feeEstimates;
  set('exec','<p class="note"><b>Fees:</b> '+(fe&&typeof fe==='object'?esc(Object.keys(fe).map(function(k){var v=fe[k];return k+': '+(v&&typeof v==='object'?JSON.stringify(v):v)}).join(' · ')):'not reported')+(ex.feesUpdatedAt?' (updated '+tm(ex.feesUpdatedAt)+')':'')+'</p>'+
   '<p class="note"><b>Latency:</b> '+(isNum(ex.latencyMs)?esc(ex.latencyMs)+' ms simulated':'not reported')+'</p>'+
   '<p class="note"><b>Funding:</b> '+esc(ex.fundingNote||'not reported')+'</p>'+
   '<p class="note"><b>Liquidation:</b> '+esc(ex.liquidationNote||'not reported')+'</p>'+
   '<p class="note"><b>Persistence:</b> '+(ps.enabled?'on':'off')+(ps.lastSavedAt?' · saved '+tm(ps.lastSavedAt):'')+(ps.error?' · <span class="neg">'+esc(ps.error)+'</span>':'')+'</p>');
  var ev=(Array.isArray(s.events)?s.events:[]).slice().sort(function(x,y){return new Date(y&&y.timestamp)-new Date(x&&x.timestamp)});
  set('events',ev.length?ev.map(function(e){e=e||{};return'<div class="row"><div><b>'+esc(String(e.type||'').replace(/_/g,' '))+'</b><small>'+esc(e.message)+'</small></div><div class="r"><small>'+tm(e.timestamp)+'</small></div></div>'}).join(''):'<div class="empty">No events</div>');
  var iu=st.initialUnits||{};
  set('strategy','<p class="note">Independent paper grid: <b>BTC long</b> ('+esc(iu.BTC==null?'--':iu.BTC)+' initial units) and <b>ETH short</b> ('+esc(iu.ETH==null?'--':iu.ETH)+' initial units) at '+esc(st.leverage==null?'--':st.leverage)+'x. Each unit is 1% of current marked equity.</p>'+
   '<p class="note">Levels are anchored to each leg\'s original entry every '+esc(st.stepPercent==null?'--':st.stepPercent)+'% and each fires only once. Favourable move: reduce '+esc(st.adjustmentUnits==null?'--':st.adjustmentUnits)+' units. Adverse move: add '+esc(st.adjustmentUnits==null?'--':st.adjustmentUnits)+' units, skipped when margin is unavailable. A closed side never reopens.</p>'+
   '<p class="note">Fills use later order-book sweeps with taker fees and quantity precision; no fills at the theoretical threshold price.</p>'+
   (st.levelPolicy?'<p class="note"><b>Level policy:</b> '+esc(typeof st.levelPolicy==='object'?JSON.stringify(st.levelPolicy):st.levelPolicy)+'</p>':'')+
   '<p class="note label" style="margin-top:10px">id '+esc(st.id||'--')+' · created '+tm(s.createdAt)+'</p>');
}

var last=null,lastOk=0,lastNow=null,sameCount=0;
function banner(msg,warn){var b=$('banner');var c='banner'+(msg?' show':'')+(warn?' warn':'');if(b.className!==c)b.className=c;if(b.textContent!==(msg||''))b.textContent=msg||''}
async function refresh(){
  try{
    var r=await fetch('api/state',{cache:'no-store'});
    if(!r.ok)throw new Error('API returned HTTP '+r.status);
    var raw=await r.text();var s=JSON.parse(raw);
    if(!s||typeof s!=='object')throw new Error('Malformed state');
    lastOk=Date.now();
    if(s.now===lastNow)sameCount++;else sameCount=0;lastNow=s.now;
    if(raw!==last){last=raw;render(s)}
    var serverAge=s.updatedAt?(Date.now()-new Date(isNum(s.updatedAt)?Number(s.updatedAt):s.updatedAt).getTime())/1000:null;
    if(s.persistence&&s.persistence.error)banner('Persistence error: '+s.persistence.error);
    else if(serverAge!==null&&serverAge>30)banner('Stale: strategy state last updated '+Math.round(serverAge)+'s ago. Prices shown may be out of date.',true);
    else if(sameCount>=5)banner('Server clock not advancing; data may be frozen.',true);
    else banner('');
    txt('foot','Fetched '+new Date().toLocaleTimeString()+' · server '+tm(s.now)+' · updated '+tm(s.updatedAt));
  }catch(e){
    var since=lastOk?Math.round((Date.now()-lastOk)/1000):null;
    banner((navigator.onLine===false?'Network offline. ':'Fetch failed: '+e.message+'. ')+(since!==null?'Showing last good data from '+since+'s ago.':'No data received yet.'));
    txt('pill',lastOk?'stale':'offline','pill bad');
  }
}
window.__render=render;
refresh();setInterval(refresh,2000);
})();
</script>
</body>
</html>
